replicaCount: 1
image:
  repository: "opensearchproject/opensearch-dashboards"
  tag: "3.8.0"
config:
  opensearch_dashboards.yml:
    opensearch.ignoreVersionMismatch: true
    # Chat — points to EC2 Agent Server via nginx (port 80)
    chat:
      enabled: true
      agUiUrl: "http://100.57.244.7/runs"
    # Sends the current page context (app id, filters, query) to the agent
    contextProvider:
      enabled: true
    # Core features
    explore.enabled: true
    data_source.enabled: true
    data_source.hideLocalCluster: false
    workspace.enabled: true
    savedObjects.permission.enabled: true
    opensearchDashboards.dashboardAdmin.users: ["admin"]
    uiSettings:
      overrides:
        "home:useNewHomePage": true
        "query:enhancements:enabled": true
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/target-type: ip
    # Restrict to Amazon Corp network (VPN) only
    alb.ingress.kubernetes.io/security-groups: sg-0f6042abc5948740a
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
  labels: {}
  hosts:
    - paths:
        - path: /
          backend: {}
global:
  dockerRegistry: public.ecr.aws
