replicas: 2

# Release images stop at 3.7.0 - there is no opensearchproject/opensearch:3.8.0
# yet, so use the staging build to match OSD 3.8.0 exactly.
image:
  repository: "opensearchstaging/opensearch"
  tag: "3.6.0"
  pullPolicy: "Always"

config:
  opensearch.yml:
    plugins:
      security:
        system_indices.enabled: false

opensearchJavaOpts: "-Xmx4G -Xms4G"
resources:
  requests:
    cpu: "2"
    memory: "8Gi"

# Chart default is true. Keep the cluster private - only OpenSearch Dashboards
# and the agent server reach it, and both run in this namespace.
ingress:
  enabled: false
