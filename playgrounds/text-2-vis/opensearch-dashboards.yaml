replicaCount: 1
# Placeholder image. The "Build OSD manually" workflow overwrites
# global.dockerRegistry, image.repository and image.tag with the image built
# from playgrounds/text-2-vis/manifests/opensearch-dashboards.yml.
image:
  repository: "r9h9r7k4/opensearch-dashboards-dev"
  tag: "30790911333-playgrounds-text-2-vis"
global:
  dockerRegistry: "public.ecr.aws"
config:
  # Merged on top of the chart defaults (connection + security settings).
  opensearch_dashboards.yml:
    opensearch.ignoreVersionMismatch: true
    # --- chat plugin (agent server) ---
    # The OSD *server* proxies to the agent server via POST /api/chat/proxy,
    # so a ClusterIP Service is enough. No ingress, no CORS.
    chat:
      enabled: true
      agUiUrl: "http://agent-server:8001/runs"
    contextProvider:
      enabled: true
    # --- required by the auto-vis feature ---
    explore.enabled: true
    data_source.enabled: true
    data_source.hideLocalCluster: false
    workspace.enabled: true
    savedObjects.permission.enabled: true
    opensearchDashboards.dashboardAdmin.users: ["admin"]
    uiSettings:
      overrides:
        # Required for the chat button to appear in the header
        "home:useNewHomePage": true
        "query:enhancements:enabled": true
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/target-type: ip
    # Restrict to Amazon Corp network (VPN) only
    alb.ingress.kubernetes.io/security-groups: sg-0f6042abc5948740a
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
  labels: {}
  hosts:
    - paths:
        - path: /
          backend: {}
